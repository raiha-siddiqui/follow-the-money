[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "follow-the-money"
version = "0.1.0"
description = "Research-only blockchain payment-tracing agent with a red-team critic, human approval and case memory"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "langgraph==1.2.16", "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-sqlite==3.1.2", "portalocker==4.4.1",
    "httpx>=0.28,<0.29", "pydantic>=2.12,<3", "PyYAML==6.0.3",
    "fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55",
    "mcp>=2.3,<2.4", "streamlit>=1.66,<1.67", "numpy>=2.4.6",
]

[project.optional-dependencies]
# Priority-model experiments (graph neural networks and gradient boosting).
ml = [
    "torch==2.14.1", "torch-geometric==2.8.1",
    "scikit-learn==1.9.1", "xgboost==3.4.1",
]
# Local Microsoft 365 Agents SDK wrapper for Agents Playground.
m365 = ["microsoft-agents-hosting-aiohttp==1.9.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "hatchling==1.32.4"]
qa = ["ruff==0.14.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/follow_the_money"]

[tool.hatch.build.targets.sdist]
# Downloaded sources, caches and local runs under data/ are never packaged.
include = ["/src/follow_the_money", "/pyproject.toml", "/README.md", "/LICENSE", "/uv.lock"]

[tool.uv]
required-version = "==0.13.5"

[tool.ruff]
required-version = "==0.14.10"
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Optional-dependency tests call pytest.importorskip before importing project code.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
